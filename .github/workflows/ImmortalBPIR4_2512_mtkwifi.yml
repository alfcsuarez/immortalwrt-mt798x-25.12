name: Build ImmortalWrt 25.12 for BPI R4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ImmortalBPIR4_2512_mtkwifi.yml'
      - 'defconfig/bpi-r4_custom_2512.config'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache git jq

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load BPI R4 custom config
        run: |
          cp defconfig/bpi-r4_custom_2512.config .config
          make defconfig

      - name: Download dependencies
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
        timeout-minutes: 120

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
        timeout-minutes: 480
        env:
          CONFIG_CCACHE_DIR: ~/.ccache

      - name: Prepare firmware artifacts
        if: success()
        run: |
          mkdir -p /tmp/firmware
          find bin/targets/mediatek/ -type f \( -name "*bananapi_bpi-r4*" -o -name "*sysupgrade*" -o -name "*preloader*" -o -name "*bl31-uboot*" -o -name "*.manifest" \) -exec cp -f {} /tmp/firmware/ \;
          echo "FIRMWARE_DIR=/tmp/firmware" >> $GITHUB_ENV
          ls -la /tmp/firmware

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BPI-R4-25.12-firmware
          path: ${{ env.FIRMWARE_DIR }}/
          retention-days: 30

      - name: Create release on success
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FIRMWARE_DIR }}/*
          tag_name: bpi-r4-25.12-build-${{ github.run_number }}
          name: ImmortalWrt 25.12 BPI-R4 Build ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
